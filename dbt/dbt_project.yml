name: energiscope_pdl
version: "1.0.0"
config-version: 2

profile: energiscope_pdl

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
docs-paths: ["docs"]

clean-targets:
  - target
  - dbt_packages

vars:
  # Séries retenues pour mart_correlation_conjoncture (une série par source, voir stg_insee_ipi / stg_bdf_pmi)
  mart_ipi_idbank: "010768265"                              # IPI CVS-CJO, industrie manufacturière (section C)
  mart_bdf_series_key: "CONJ2.M.R52.S.IN.000CZ.ICAIN000.10" # BdF PDL, climat des affaires, industrie manufacturière, CVS

models:
  energiscope_pdl:
    staging:
      +materialized: view
      +schema: silver
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +schema: gold
