name: dbt docs

# Publie la documentation dbt (index.html, catalog.json, manifest.json) sur GitHub Pages à chaque push sur main.
#
# Étape manuelle, une seule fois : Settings > Pages > Build and deployment > Source = « GitHub Actions ».
# Secrets requis : DATABRICKS_HOST, DATABRICKS_TOKEN, DATABRICKS_HTTP_PATH, DBT_CATALOG, DBT_SCHEMA.
# Voir CLAUDE.md, section « CI/CD GitHub Actions ».
on:
  push:
    branches: [main]
  # Relance manuelle depuis l'onglet Actions (le déploiement reste réservé à main : voir l'environnement github-pages)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un déploiement à la fois ; on laisse le déploiement en cours se terminer
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Générer la documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dbt
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DBT_CATALOG: ${{ secrets.DBT_CATALOG }}
      DBT_SCHEMA: ${{ secrets.DBT_SCHEMA }}
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt/ci

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v7

      - name: Installer Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('dbt/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Installer dbt-databricks
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          dbt --version

      - name: Vérifier les secrets
        working-directory: .
        run: bash .github/scripts/check_secrets.sh

      - name: dbt deps
        run: dbt deps

      # Échoue en 3 minutes au lieu de bloquer ~15 minutes si Databricks est injoignable
      - name: Tester la connexion Databricks
        run: |
          timeout 180 dbt debug --target prod --connection || {
            echo "::error::Connexion à Databricks impossible ou plus de 180 s : vérifier DATABRICKS_HOST, DATABRICKS_HTTP_PATH, DATABRICKS_TOKEN et le démarrage du warehouse."
            exit 1
          }

      # Cible « prod » : le catalogue décrit les vraies tables silver et gold (lecture seule, aucun modèle construit)
      - name: dbt docs generate
        run: dbt docs generate --target prod

      - name: Préparer le site
        run: |
          mkdir -p ../docs_site
          cp target/index.html target/catalog.json target/manifest.json ../docs_site/
          ls -la ../docs_site

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v6

      - name: Publier l'artefact du site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs_site

      - name: Logs dbt complets
        if: failure()
        run: |
          echo "::group::dbt/logs/dbt.log"
          cat logs/dbt.log || echo "Pas de fichier de logs."
          echo "::endgroup::"

      - name: Conserver les logs dbt
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dbt-logs
          path: dbt/logs
          if-no-files-found: ignore

  deploy:
    name: Déployer sur GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v5
